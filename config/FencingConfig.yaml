# Fencing Duel Training Configuration
# Based on best practices from Riposte! devlog and optimized for 4-8 parallel arenas

behaviors:
  FencingSword:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 1024             
      buffer_size: 20480            
      learning_rate: 0.0001         
      beta: 0.01                  
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
    
    network_settings:
      normalize: true
      hidden_units: 512            
      num_layers: 3
      vis_encode_type: simple
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    
    self_play:
      save_steps: 60000             
      swap_steps: 30000
      window: 15                    
      play_against_latest_model_ratio: 0.45
      team_change: 10000
    
    max_steps: 10000000             
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 50000